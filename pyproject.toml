[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",     # Line too long (formatting & long prompt templates)
    "W291",     # Trailing whitespace in multiline templates
    "RUF001",   # Ambiguous unicode characters (symbols, dashes, emojis in prompt outputs)
    "RUF005",   # Collection literal concatenation
    "E402",     # Module level import not at top of file
    "BLE001",   # Broad exception catching in fallback and retry handlers
    "ASYNC230", # Blocking open call in async function for local evaluation files
    "DTZ003",   # datetime.datetime.utcnow() usage
    "S110",     # try-except-pass in fallback routines
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Allow assert statements in tests
    "RUF059",   # Allow unused unpacked variables in test verifications
    "F401",     # Allow unused imports in tests
]
