name: OmniQuery-AI CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Regression Tests & Quality Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omni_user
          POSTGRES_PASSWORD: omni_password
          POSTGRES_DB: omniquery_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-asyncio pytest-cov

      - name: Code Quality & Syntax Check (Ruff Linting)
        run: |
          ruff check app/ tests/

      - name: Seed Database Schema & Vector Data
        env:
          DATABASE_URL: postgresql+asyncpg://omni_user:omni_password@localhost:5433/omniquery_db
        run: |
          python -m app.db_seed

      - name: Execute Full Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://omni_user:omni_password@localhost:5433/omniquery_db
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest tests/ -v --durations=10

      - name: Verify RAGAS Quality Benchmarks
        env:
          DATABASE_URL: postgresql+asyncpg://omni_user:omni_password@localhost:5433/omniquery_db
        run: |
          pytest tests/test_ragas_bench.py -v
